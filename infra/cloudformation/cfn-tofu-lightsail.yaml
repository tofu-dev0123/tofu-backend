AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Blog Platform Backend - production infrastructure (Lightsail VPS + static IP).
  Raw CloudFormation for the Lambda -> Lightsail migration (Issue #74). Scaffold:
  real values and secrets are finalized or injected manually at deploy time.
  The S3 image-upload IAM user/policy already exist and are managed outside this
  stack. See infra/README.md.

# =============================================================================
# 前提・設計 (詳細は infra/README.md)
# -----------------------------------------------------------------------------
# - リージョン: ap-northeast-1 (東京) にデプロイすること
# - Web 経路 : Cloudflare(orange) -> Lightsail:443 (Caddy + Origin Cert) -> uvicorn
# - SSH 経路 : CI は Cloudflare Tunnel (localhost:22)。管理はコンソールのブラウザ SSH
#              (22 は lightsail-connect のみ許可し、インターネットには非公開)
# - 秘密     : トンネルトークン / IAM アクセスキー / .env.production は手動投入
# - 命名/タグ: ProjectPrefix でアプリを識別できるよう統一
# =============================================================================

Parameters:
  ProjectPrefix:
    Type: String
    Default: tofu
    Description: Prefix for resource names and tags so the stack is identifiable in the console.

  EnvName:
    Type: String
    Default: prod
    AllowedValues:
      - prod
      - dev
    Description: Environment name used in resource names and tags.

  BundleId:
    Type: String
    Default: micro_3_0
    Description: >
      Lightsail bundle (spec). micro_3_0 is assumed to be the 1GB RAM tier.
      TODO: confirm the exact id via `aws lightsail get-bundles --region ap-northeast-1`.

  BlueprintId:
    Type: String
    Default: ubuntu_24_04
    Description: >
      OS blueprint.
      TODO: confirm the exact id via `aws lightsail get-blueprints --region ap-northeast-1`.

  AvailabilityZone:
    Type: String
    Default: ap-northeast-1a
    Description: Availability zone to place the instance in.

  CloudflareIpv4Cidrs:
    Type: CommaDelimitedList
    # 公式リスト https://www.cloudflare.com/ips-v4 の全レンジ (2026-07-05 取得)。
    # 変わることがあるので cutover 前に再確認する。
    Default: "173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22"
    Description: Allowed source ranges for 80/443 (Cloudflare IPv4). Required to prevent origin direct access.

  CloudflareIpv6Cidrs:
    Type: CommaDelimitedList
    # 公式リスト https://www.cloudflare.com/ips-v6 の全レンジ (2026-07-05 取得)。
    Default: "2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"
    Description: Allowed source ranges for 80/443 (Cloudflare IPv6).

Resources:
  # ---------------------------------------------------------------------------
  # Lightsail インスタンス
  #   - 初回プロビジョニングは UserData にインライン (秘密不要な処理のみ)
  #   - Networking.Ports は 80/443 のみ・Cloudflare レンジ限定。22 は開けない
  # ---------------------------------------------------------------------------
  BackendInstance:
    Type: AWS::Lightsail::Instance
    Properties:
      InstanceName: !Sub "${ProjectPrefix}-${EnvName}"
      BundleId: !Ref BundleId
      BlueprintId: !Ref BlueprintId
      AvailabilityZone: !Ref AvailabilityZone
      # 初回ブート時に cloud-init が root で 1 回だけ実行するプロビジョニング。
      # 秘密が不要な処理のみをここに書く。秘密が必要な手順 (トンネル常駐 / 公開鍵配置 /
      # GHCR ログイン / .env・証明書配置・起動) は起動後に手動で行う (infra/README.md)。
      # Lightsail は UserData を自前の前置きに連結し /bin/sh (dash) で実行するため、
      # シバンは効かず bash 専用構文は使えない。POSIX sh 互換で書く (pipefail 不可)。
      UserData: |
        #!/bin/sh
        set -eu
        export DEBIAN_FRONTEND=noninteractive

        APP_DIR=/srv/app
        DEPLOY_USER=deploy
        CLOUDFLARED_DEB_URL="https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-arm64.deb"

        log() { echo "[bootstrap] $*"; }

        # 1. ベースパッケージ + タイムゾーン
        #    初回ブートの自動 apt と競合しうるため dpkg ロックを最大 300 秒待つ。
        log "apt update & base packages"
        APT="apt-get -o DPkg::Lock::Timeout=300"
        $APT update -y
        $APT install -y ca-certificates curl gnupg
        timedatectl set-timezone Asia/Tokyo || true

        # 2. Docker + compose plugin (公式スクリプト。compose v2 プラグイン同梱)
        if ! command -v docker >/dev/null 2>&1; then
          log "install docker"
          curl -fsSL https://get.docker.com | sh
        fi
        systemctl enable --now docker

        # 3. cloudflared (ARM64) バイナリのみ導入。
        #    トンネル常駐 (`cloudflared service install <token>`) は接続トークンが必要な
        #    ため起動後に手動実行する (README PART 2)。
        if ! command -v cloudflared >/dev/null 2>&1; then
          log "install cloudflared"
          curl -fsSL -o /tmp/cloudflared.deb "${CLOUDFLARED_DEB_URL}"
          dpkg -i /tmp/cloudflared.deb
          rm -f /tmp/cloudflared.deb
        fi

        # 4. デプロイ用ユーザー (docker グループ)。公開鍵配置は手動 (README PART 2)。
        if ! id "${DEPLOY_USER}" >/dev/null 2>&1; then
          log "create deploy user"
          useradd -m -s /bin/bash "${DEPLOY_USER}"
        fi
        usermod -aG docker "${DEPLOY_USER}"
        install -d -m 700 -o "${DEPLOY_USER}" -g "${DEPLOY_USER}" "/home/${DEPLOY_USER}/.ssh"

        # 5. sshd ハードニング (鍵認証のみ / root ログイン禁止)。drop-in で冪等。
        #    SSH は cloudflared トンネル経由 (localhost:22) で使う。
        log "harden sshd"
        install -d -m 755 /etc/ssh/sshd_config.d
        cat > /etc/ssh/sshd_config.d/99-hardening.conf <<'HARDENING'
        PasswordAuthentication no
        PermitRootLogin no
        PubkeyAuthentication yes
        HARDENING
        systemctl reload ssh 2>/dev/null || systemctl reload sshd 2>/dev/null || true

        # 6. アプリ配置ディレクトリ (資材の配布は CI の SSH デプロイ or 手動 scp)。
        install -d -m 750 -o "${DEPLOY_USER}" -g "${DEPLOY_USER}" "${APP_DIR}"
        install -d -m 700 -o "${DEPLOY_USER}" -g "${DEPLOY_USER}" "${APP_DIR}/certs"

        # 7. 自動セキュリティ更新 (既定では自動再起動しない)
        log "enable unattended-upgrades"
        $APT install -y unattended-upgrades
        systemctl enable --now unattended-upgrades || true

        log "自動プロビジョニング完了。次は手動手順 (README PART 2) を実施。"
      Networking:
        Ports:
          - FromPort: 443
            ToPort: 443
            Protocol: tcp
            Cidrs: !Ref CloudflareIpv4Cidrs
            Ipv6Cidrs: !Ref CloudflareIpv6Cidrs
          - FromPort: 80
            ToPort: 80
            Protocol: tcp
            Cidrs: !Ref CloudflareIpv4Cidrs
            Ipv6Cidrs: !Ref CloudflareIpv6Cidrs
          # 22 (SSH) はインターネットには公開しない。lightsail-connect エイリアスで
          # Lightsail コンソールのブラウザ SSH からのみ到達可能にする (管理用)。
          # CI デプロイは Cloudflare Tunnel が箱内の localhost:22 に繋ぐため FW とは無関係。
          - FromPort: 22
            ToPort: 22
            Protocol: tcp
            CidrListAliases:
              - lightsail-connect
      Tags:
        - Key: Project
          Value: !Ref ProjectPrefix
        - Key: Environment
          Value: !Ref EnvName

  # ---------------------------------------------------------------------------
  # 静的IP (インスタンスに付与し、Cloudflare の A レコードから参照する)
  #   ※ AWS::Lightsail::StaticIp は Tags 非対応
  # ---------------------------------------------------------------------------
  BackendStaticIp:
    Type: AWS::Lightsail::StaticIp
    DependsOn: BackendInstance
    Properties:
      StaticIpName: !Sub "${ProjectPrefix}-${EnvName}-ip"
      AttachedTo: !Sub "${ProjectPrefix}-${EnvName}"

  # ---------------------------------------------------------------------------
  # NOTE: S3 画像アップロード用 IAM ユーザー/ポリシーは既に手動作成済みのため
  #       このスタックでは管理しない。アプリはその既存ユーザーのアクセスキーを
  #       .env.production 経由で使う (README 参照)。
  #       必要な最小権限: s3:PutObject / GetObject / DeleteObject on
  #                        arn:aws:s3:::tofu-blog-image-prod/*
  # ---------------------------------------------------------------------------

Outputs:
  StaticIpAddress:
    Description: Static IP to set on the Cloudflare A record.
    Value: !GetAtt BackendStaticIp.IpAddress
  InstanceName:
    Description: Lightsail instance name.
    Value: !Sub "${ProjectPrefix}-${EnvName}"
