name: CI

# develop への PR で検証を実行する (production へは develop 経由で流れる前提)。
# pytest (Docker) / pyright / cfn-lint を実行する。AWS 認証は不要。
on:
  pull_request:
    branches: [develop]

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # db (postgres) + localstack (S3) は depends_on で自動起動する
      - name: Run pytest
        run: docker compose run --rm api pytest

  typecheck:
    name: pyright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # ローカルと同条件で実行する。アプリの依存は入れず、未解決 import は
      # pyrightconfig.json の reportMissingImports=false に委ねる。
      - name: Install pyright
        run: pip install pyright
      - name: Run pyright
        run: pyright

  cfn-lint:
    name: cfn-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cfn-lint
        run: pip install cfn-lint
      - name: Run cfn-lint
        run: cfn-lint infra/cloudformation/*.yaml
