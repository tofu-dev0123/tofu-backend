name: Deploy dev

# staging ブランチへの push で dev 環境へ自動デプロイ (Stage 2)。
on:
  push:
    branches: [staging]

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write   # OIDC で AWS Role を assume するために必須
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # DB マイグレーション: DATABASE_URL / SECRET_KEY は SSM から取得する。
      # AWS_* は OIDC セッションの一時認証情報をコンテナへ渡す
      # (.env.local のダミー値を上書きする)。必須項目 (SECRET_KEY/ALGORITHM/
      # CORS_ALLOW_ORIGINS) は .env.local から供給される。
      - name: DB migration (dev)
        run: |
          docker compose run --rm --no-deps \
            -e APP_ENV=staging \
            -e DATABASE_URL_SSM=/blog-platform-backend/dev/DATABASE_URL \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_SESSION_TOKEN -e AWS_REGION \
            api alembic upgrade head

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Setup CDK dependencies
        working-directory: cdk
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          npm ci

      - name: cdk deploy (dev)
        working-directory: cdk
        run: node_modules/.bin/cdk deploy -c env=dev --require-approval never
