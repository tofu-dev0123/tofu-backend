name: Validate

# PR 検証 / デプロイ前検証で共通利用する再利用ワークフロー。
# pytest (Docker) / pyright / cdk synth を実行する。AWS 認証は不要。
on:
  workflow_call:

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # db (postgres) + localstack (S3) は depends_on で自動起動する
      - name: Run pytest
        run: docker compose run --rm api pytest

  typecheck:
    name: pyright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # アプリ + CDK の依存を入れて import を解決させる
      # (pyrightconfig.json は reportMissingImports=false だが型解決のため)
      - name: Install dependencies
        run: pip install -r requirements.txt -r cdk/requirements.txt pyright
      - name: Run pyright
        run: pyright

  synth:
    name: cdk synth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Setup CDK dependencies
        working-directory: cdk
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          npm ci
      # 非機密設定は cdk/config/dev.env にコミット済みのため AWS 認証なしで synth 可能
      - name: cdk synth
        working-directory: cdk
        run: node_modules/.bin/cdk synth -c env=dev
